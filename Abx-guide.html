<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>抗菌薬エンピリック選択</title>
<style>
/* パスワード入力だけの1画面。本体と同じ配色 */
:root{
  --paper:#F2F5F4; --surface:#FFFFFF; --ink:#15232A; --muted:#5A6A70; --line:#D5DEDD;
  --accent:#0B6B66; --error:#A3312A;
  --font-body:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --paper:#0F1719; --surface:#172225; --ink:#E4ECEB; --muted:#98A9AD; --line:#2A3A3E; --accent:#4FC2B8; --error:#F08A80; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-body);display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:19px;line-height:1.4}
p{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
label{font-size:13px;font-weight:700}
input[type="password"]{font:inherit;font-size:16px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.remember{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted)}
button{font:inherit;font-size:15px;font-weight:700;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.err{color:var(--error);font-size:13px;min-height:1.2em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>抗菌薬エンピリック選択</h1>
  <p>関係者向けの限定ページです。共有されたパスワードを入力してください。</p>
  <div style="display:flex;flex-direction:column;gap:6px">
    <label for="pw">パスワード</label>
    <input type="password" id="pw" required autofocus>
  </div>
  <label class="remember" for="rm"><input type="checkbox" id="rm"> この端末で記憶する</label>
  <button type="submit" id="go">開く</button>
  <div class="err" id="err" role="alert"></div>
</form>

  var KEY_NAME = "abx-guide-key-" + P.salt.slice(0,8);
  function b64(s){ var b=atob(s),u=new Uint8Array(b.length); for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return u; }
  function toB64(buf){ var u=new Uint8Array(buf),s=""; for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]); return btoa(s); }

  function deriveRaw(pw){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"])
      .then(function(base){
        return crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(P.salt), iterations:P.iter}, base, 256);
      });
  }
  function decrypt(raw){
    return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"])
      .then(function(k){ return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, k, b64(P.ct)); })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }
  function show(html){ document.open(); document.write(html); document.close(); }

  // 記憶済みの鍵があれば自動で開く
  try{
    var saved = localStorage.getItem(KEY_NAME);
    if(saved){ decrypt(b64(saved)).then(show).catch(function(){ try{localStorage.removeItem(KEY_NAME);}catch(e){} }); }
  }catch(e){}

  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    var btn=document.getElementById("go"), err=document.getElementById("err");
    if(!window.crypto || !crypto.subtle){ err.textContent="このブラウザでは開けません。https のURLで開いてください。"; return; }
    btn.disabled=true; btn.textContent="確認中…"; err.textContent="";
    var raw;
    deriveRaw(document.getElementById("pw").value)
      .then(function(r){ raw=r; return decrypt(r); })
      .then(function(html){
        if(document.getElementById("rm").checked){ try{ localStorage.setItem(KEY_NAME, toB64(raw)); }catch(e){} }
        show(html);
      })
      .catch(function(){
        btn.disabled=false; btn.textContent="開く";
        err.textContent="パスワードが違います。";
      });
  });
})();
